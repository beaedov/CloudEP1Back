spring.application.name=pedidos360-backend
server.port=8081


spring.datasource.url=jdbc:h2:mem:pedidos360db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.profile.tenant-id= 2c0cebc1-13dd-4019-a6cc-ea325b462603
spring.cloud.azure.active-directory.credential.client-id= 43903083-a004-42f2-b933-49291d86c8f6
spring.cloud.azure.active-directory.app-id-uri= api://evaluacion1cloud.onmicrosoft.com/pedidos360

# ===== RabbitMQ (cluster de 2 nodos) =====
spring.rabbitmq.addresses=${RABBIT_ADDRESSES:localhost:5672,localhost:5673}
spring.rabbitmq.username=${RABBIT_USER:admin}
spring.rabbitmq.password=${RABBIT_PASS:admin123}
spring.rabbitmq.virtual-host=/
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ===== Kafka (cluster de 3 brokers) =====
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# acks=all: el lider espera a las replicas en sincronia (min.insync.replicas=2)
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
# idempotencia: los reintentos no generan duplicados
spring.kafka.producer.properties.enable.idempotence=true
# si Kafka esta caido, no bloquea la peticion HTTP mas de 5 segundos
spring.kafka.producer.properties.max.block.ms=5000
# los consumidores no conocen las clases Java de este servicio
spring.kafka.producer.properties.spring.json.add.type.headers=false
app.kafka.topico-eventos=pedidos-eventos
